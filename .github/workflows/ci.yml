name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      - run: swift build -c release
      - run: '"$(swift build -c release --show-bin-path)/msecret" --help'
